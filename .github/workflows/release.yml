# Builds the six release binaries, publishes a GitHub Release with checksums,
# then publishes the npm packages. A tag push runs the whole workflow.
# workflow_dispatch runs only the npm job against an existing release.
# Nothing in this file runs on a pull request.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to publish to npm (vX.Y.Z, matching Cargo.toml at that tag)
        required: true
        type: string

permissions:
  contents: write

jobs:
  # The version lives in the manifests only. Refuse a tag that disagrees
  # with them, so a release can never ship binaries under another number.
  version:
    name: tag matches the manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Compare the tag with Cargo.toml, npm/*/package.json and server.json
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "${TAG#v}" != "$crate" ]; then
            echo "tag ${TAG} does not match Cargo.toml version ${crate}; bump the manifests or tag v${crate}"
            exit 1
          fi
          for file in npm/*/package.json server.json; do
            if grep -E '"[0-9]+\.[0-9]+\.[0-9]+"' "$file" | grep -v "\"${crate}\"" | grep -q .; then
              echo "${file} has a version other than ${crate}"
              exit 1
            fi
          done
          echo "releasing ${crate}"

  build:
    if: github.event_name == 'push'
    needs: version
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: trammel-linux-x64
            linker: musl-gcc
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: trammel-linux-arm64
            linker: musl-gcc
          - os: macos-15
            target: aarch64-apple-darwin
            asset: trammel-darwin-arm64
            linker: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: trammel-darwin-x64
            linker: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            asset: trammel-windows-x64
            linker: ""
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: trammel-windows-arm64
            linker: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - name: musl linker
        if: matrix.linker != ''
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.linker }}" ]; then
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER="${{ matrix.linker }}"
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="${{ matrix.linker }}"
          fi
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          dest="${{ matrix.target }}"
          mkdir -p "dist/${{ matrix.asset }}"
          if [[ "${{ matrix.asset }}" == trammel-windows-* ]]; then
            cp "target/${dest}/release/trammel.exe" "target/${dest}/release/trammel-mcp.exe" "dist/${{ matrix.asset }}/"
          else
            cp "target/${dest}/release/trammel" "target/${dest}/release/trammel-mcp" "dist/${{ matrix.asset }}/"
          fi
          tar -C dist -czf "dist/${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.sha256")
          else
            (cd dist && shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.sha256

  github-release:
    if: github.event_name == 'push'
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          cat *.sha256 | sort > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          notes="Trammel ${tag}. Verify SHA256SUMS before installing. npm publish of @iron_adamant/trammel and the six @iron_adamant/trammel-<os>-<arch> packages follows this job and needs the NPM_TOKEN repository secret. Scoped packages are published with --access public."
          # This job does not check out the repo. gh must be given --repo or it runs git and fails.
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "release ${tag} already exists"
            gh release upload "$tag" dist/*.tar.gz dist/SHA256SUMS --repo "$repo" --clobber
          else
            gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS --repo "$repo" --title "$tag" --notes "$notes"
          fi

  npm:
    name: npm registry
    needs: [version, github-release]
    if: always() && needs.version.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.github-release.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      # The tagged commit, so the wrapper's optionalDependencies match the release.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          scope: "@iron_adamant"
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push'
        with:
          path: dist
          merge-multiple: true
      - name: Download the existing release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          case "$tag" in
            v[A-Za-z0-9._+-]*)
              case "$tag" in
                *[!A-Za-z0-9._+-]*) echo "tag has unexpected characters"; exit 1 ;;
              esac
              ;;
            *) echo "tag must look like vX.Y.Z"; exit 1 ;;
          esac
          mkdir -p dist
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist
          (cd dist && sha256sum -c SHA256SUMS)
          printf '%s\n' "$tag" > dist/release-tag.txt
      - name: Publish platform packages, then the wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not set. Add it as a repository secret. The value is not printed."
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$(cat dist/release-tag.txt)"
          else
            tag="${REF_NAME}"
          fi
          version="${tag#v}"
          publish() {
            dir="$1"
            case "$dir" in
              ./npm/*) ;;
              *) echo "refusing to publish a path npm would treat as a git repo: $dir"; exit 1 ;;
            esac
            name="$(npm pkg get name --prefix "$dir" | tr -d '"')"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published"
              return 0
            fi
            # Scoped packages are restricted unless --access public is set.
            # The ./ prefix keeps npm from reading npm/<pkg> as github.com/npm/<pkg>.
            npm publish --access public "$dir"
          }
          # Platform packages first, then the wrapper that optionalDepends on them.
          for asset in trammel-linux-x64 trammel-linux-arm64 trammel-darwin-x64 trammel-darwin-arm64 trammel-windows-x64 trammel-windows-arm64; do
            dir="./npm/${asset}"
            tar -xzf "dist/${asset}.tar.gz" -C "$dir" --strip-components=1
            npm pkg set version="${version}" --prefix "$dir"
            publish "$dir"
          done
          npm pkg set version="${version}" --prefix ./npm/trammel
          publish ./npm/trammel
