name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Test
        run: cargo test --locked
      - name: Zero dependencies
        run: python scripts/check_zero_deps.py
      - name: No leftover markers
        run: python scripts/check_no_todos.py
      - name: Syntax core manifest
        run: python scripts/check_syntax_core.py

  bench-rule:
    name: benchmark regression rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: A/A passes and an injected slowdown fails
        run: cargo test --locked --lib benchstat -- --test-threads=8
      - name: Startup beats the Python floor
        run: |
          cargo build --release --locked
          python scripts/bench_gate.py target/release/trammel
