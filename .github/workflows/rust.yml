name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Test
        run: cargo test --locked
      - name: Zero dependencies
        run: cargo run --locked --example check_zero_deps
      - name: No leftover markers
        run: cargo run --locked --example check_no_todos
      - name: Syntax core manifest
        run: cargo run --locked --example check_syntax_core

  bench-rule:
    name: benchmark regression rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: A/A passes and an injected slowdown fails
        run: cargo test --locked --lib benchstat -- --test-threads=8
      - name: Startup beats the Python floor
        run: |
          cargo build --release --locked
          cargo run --release --locked --example bench_gate -- target/release/trammel
